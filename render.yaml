services:
  # ─── BACKEND (FastAPI) ──────────────────────────────────────
  - type: web
    name: aviu-backend
    runtime: python
    rootDir: backend
    plan: starter              # $7/mo -- required for persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: aviu-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        value: sqlite:////data/aviu_timetable.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false            # set after frontend deploys

  # ─── FRONTEND (Vite / React) ─────────────────────────────────
  - type: web
    name: aviu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false            # set to https://aviu-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html