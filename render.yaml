services:
  - type: web
    name: aviu-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: cd ../frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt && mkdir -p app/static && cp -r ../frontend/dist/* app/static/
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: aviu_timetable
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: "https://timetable-90by.onrender.com"